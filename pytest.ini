[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: quick sanity checks
    regression: full regression suite
    real_device: requires a physical device
    simulator: requires a simulator
    app_reset(strategy, bundle_id=None): force_close, clear, reinstall or none
    group_booking: needs the host device plus the PLAYER_<n> devices
    regression_existing: end to end booking per payment method on existing accounts
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
timeout = 600
